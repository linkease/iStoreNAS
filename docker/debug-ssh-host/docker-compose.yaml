services:
  be96-debug:
    image: linkease/be96-debug:latest
    container_name: be96-debug
    restart: unless-stopped
    privileged: true
    network_mode: host
    pid: host
    ipc: host
    uts: host
    cgroup: host
    environment:
      DEBUG_SSH_PORT: "2223"
      DEBUG_AUTHORIZED_KEYS: "${DEBUG_AUTHORIZED_KEYS:?set DEBUG_AUTHORIZED_KEYS to your SSH public key}"
    volumes:
      - /:/host:rw,rslave
      - /var/run/docker.sock:/var/run/docker.sock:rw
