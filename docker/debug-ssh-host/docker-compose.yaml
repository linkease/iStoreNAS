services:
  be96-debug:
    image: linkease/be96-debug:latest
    container_name: be96-debug
    restart: unless-stopped
    privileged: true
    network_mode: host
    pid: host
    ipc: host
    uts: host
    cgroup: host
    environment:
      DEBUG_SSH_PORT: "2223"
      DEBUG_AUTHORIZED_KEYS: "${DEBUG_AUTHORIZED_KEYS:-}"
      DEBUG_PASSWORD: "${DEBUG_PASSWORD:-}"
      ISTOREOS_AUTO_START: "${ISTOREOS_AUTO_START:-0}"
      ISTOREOS_CONTAINER: "${ISTOREOS_CONTAINER:-istoreos}"
      ISTOREOS_IMAGE: "${ISTOREOS_IMAGE:-linkease/istore-in-be96:24.10}"
      ISTOREOS_BRIDGE: "${ISTOREOS_BRIDGE:-br-istoreos}"
      ISTOREOS_PARENT: "${ISTOREOS_PARENT:-eth0}"
      ISTOREOS_DNS: "${ISTOREOS_DNS:-}"
    volumes:
      - /:/host:rw,rslave
      - /var/run/docker.sock:/var/run/docker.sock:rw
